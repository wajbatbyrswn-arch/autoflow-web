<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>AutoFlow - ربط الحساب</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(20px);
    }
    .logo { font-size: 40px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #a78bfa; }
    p { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #34d399; font-size: 50px; margin-bottom: 16px; }
    .error-msg { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">
      <div class="logo">🔗</div>
      <div class="spinner"></div>
      <h1>جارٍ ربط الحساب...</h1>
      <p>يرجى الانتظار، يتم نقلك إلى AutoFlow</p>
    </div>
    <div id="success" style="display:none">
      <div class="success">✅</div>
      <h1>تم الربط بنجاح!</h1>
      <p>يمكنك إغلاق هذه النافذة والعودة إلى AutoFlow</p>
    </div>
    <div id="error" style="display:none">
      <div class="logo">❌</div>
      <h1 class="error-msg">فشل الربط</h1>
      <p id="error-msg" class="error-msg"></p>
    </div>
  </div>

  <script>
    (function () {
      // Read token from URL hash (Facebook puts it here)
      var hash = window.location.hash.replace('#', '')
      var params = new URLSearchParams(hash)
      var token = params.get('access_token')
      var error = params.get('error_description') || params.get('error')

      if (token) {
        // Redirect to AutoFlow custom protocol
        // Electron registers autoflow:// and intercepts it
        var deepLink = 'autoflow://oauth/callback?access_token=' + encodeURIComponent(token)
        window.location.href = deepLink

        // Show success after short delay
        setTimeout(function () {
          document.getElementById('loading').style.display = 'none'
          document.getElementById('success').style.display = 'block'
        }, 1000)
      } else if (error) {
        document.getElementById('loading').style.display = 'none'
        document.getElementById('error').style.display = 'block'
        document.getElementById('error-msg').textContent = decodeURIComponent(error)
      } else {
        document.getElementById('loading').style.display = 'none'
        document.getElementById('error').style.display = 'block'
        document.getElementById('error-msg').textContent = 'لم يتم الحصول على التوكن'
      }
    })()
  </script>
</body>
</html>
